version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repomentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/repomentor
    depends_on:
      - postgres
    volumes:
      - .:/app

  frontend:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - .:/app

volumes:
  postgres_data:
